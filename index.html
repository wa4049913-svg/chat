<html lang="en">
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#111b21;--pn:#202c33;--ch:#0b141a;--me:#005c4b;--yo:#202c33;--tx:#e9edef;--dim:#8696a0;--ac:#00a884;--bl:#53bdeb;--bd:#2a3942;--dg:#f15c6d;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
body.light{--bg:#fff;--pn:#f0f2f5;--ch:#efeae2;--me:#d9fdd3;--yo:#fff;--tx:#111b21;--dim:#667781;--bd:#e9edef}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;background:none;border:0;outline:0;width:100%}
.hide{display:none!important}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
#login{position:fixed;inset:0;display:grid;place-items:center;background:var(--ch);z-index:100;padding:20px}
.lc{background:var(--pn);padding:28px;border-radius:14px;width:100%;max-width:380px}
.lc h1{font-size:26px;margin-bottom:4px}.lc p{color:var(--dim);margin-bottom:18px}
.lc input,.fld{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.btn{background:var(--ac);color:#fff;font-weight:600;border-radius:10px;padding:12px 18px;width:100%}
.btn.g{background:var(--pn);color:var(--tx);border:1px solid var(--bd)}.btn.r{background:var(--dg)}
#app{display:flex;height:100dvh}
#side{width:400px;max-width:100%;border-right:1px solid var(--bd);display:flex;flex-direction:column;background:var(--bg);position:relative;padding-top:var(--st)}
#main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--ch);position:relative}
@media(max-width:860px){#side{width:100%}#main{position:fixed;inset:0;z-index:20;transform:translateX(100%);transition:transform .22s}#app.open #main{transform:none}}
.hd{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--pn);flex-shrink:0}
#main .hd{padding-top:calc(10px + var(--st))}
.hd .t{flex:1;min-width:0;cursor:pointer}.hd .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hd .s{font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hd .s.on{color:var(--ac)}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px;color:var(--dim);flex-shrink:0}.ib:active{background:var(--bd)}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;overflow:hidden;flex-shrink:0;position:relative}
.av.sm{width:36px;height:36px;font-size:15px}.av.lg{width:110px;height:110px;font-size:44px;margin:0 auto 14px}
.od{position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:var(--ac);border:2px solid var(--bg)}
.sr{padding:8px 12px;background:var(--bg)}.sr input{background:var(--pn);border-radius:10px;padding:9px 14px}
.chips{display:flex;gap:8px;padding:2px 12px 8px}.chip{padding:5px 14px;border-radius:16px;background:var(--pn);color:var(--dim);font-size:13.5px}.chip.on{background:rgba(0,168,132,.2);color:var(--ac)}
#list{flex:1;overflow-y:auto}
.ci{display:flex;gap:13px;padding:10px 14px;cursor:pointer;align-items:center}.ci:hover,.ci.act{background:var(--pn)}
.cm{flex:1;min-width:0;border-bottom:1px solid var(--bd);padding-bottom:10px}.r1,.r2{display:flex;justify-content:space-between;gap:8px;align-items:center}
.cn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ct{font-size:12px;color:var(--dim)}.ct.u{color:var(--ac)}
.cl{font-size:13.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bdg{background:var(--ac);color:#fff;border-radius:11px;min-width:21px;height:21px;display:grid;place-items:center;font-size:12px;font-weight:700;padding:0 6px}
.empty{text-align:center;color:var(--dim);padding:60px 24px}
.fab{position:absolute;right:18px;bottom:calc(18px + var(--sb));width:54px;height:54px;border-radius:16px;background:var(--ac);color:#fff;font-size:24px;box-shadow:0 4px 14px rgba(0,0,0,.4);display:grid;place-items:center}
#welcome{flex:1;display:grid;place-items:center;text-align:center;color:var(--dim);padding:30px}#welcome h2{color:var(--tx);margin:10px 0}
#msgs{flex:1;overflow-y:auto;padding:14px 8% 8px;display:flex;flex-direction:column;gap:2px;background-image:radial-gradient(rgba(128,128,128,.07) 1px,transparent 1px);background-size:22px 22px}
@media(max-width:860px){#msgs{padding:12px 10px 6px}}
.day,.sys{align-self:center;background:var(--pn);color:var(--dim);font-size:12px;padding:4px 12px;border-radius:8px;margin:8px 0}
.msg{max-width:min(75%,520px);padding:6px 9px 4px;border-radius:9px;position:relative;word-break:break-word;box-shadow:0 1px 1px rgba(0,0,0,.2);margin-top:2px}
.msg.me{align-self:flex-end;background:var(--me);border-top-right-radius:2px}.msg.yo{align-self:flex-start;background:var(--yo);border-top-left-radius:2px}
.msg .t{white-space:pre-wrap}.msg a{color:var(--bl)}
.mt{font-size:11px;color:var(--dim);text-align:right;margin-top:2px;white-space:nowrap}
.sn{font-size:12.5px;font-weight:600}.fw{font-size:12px;color:var(--dim);font-style:italic}.dd{color:var(--dim);font-size:14px}
.rq{background:rgba(0,0,0,.2);border-left:4px solid var(--ac);border-radius:6px;padding:4px 8px;margin-bottom:4px;font-size:13px;cursor:pointer}.rq b{display:block;color:var(--ac)}.rq span{color:var(--dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mi{max-width:100%;max-height:320px;border-radius:7px;display:block;cursor:pointer}
.fl{display:flex;gap:10px;align-items:center;padding:6px 2px}.fl a{color:inherit;font-weight:600}
audio{height:36px;max-width:230px}
.rx{position:absolute;bottom:-12px;left:8px;background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:0 6px;font-size:13px}.msg.hr{margin-bottom:12px}
.chev{position:absolute;top:2px;right:4px;opacity:0;font-size:13px;color:var(--dim);background:inherit;border-radius:50%;width:22px}
.msg:hover .chev{opacity:1}
.flash{animation:fl 1.2s}@keyframes fl{0%,60%{filter:brightness(1.8)}}
#ctx{position:fixed;z-index:300;background:var(--pn);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.5);min-width:200px;overflow:hidden;border:1px solid var(--bd)}
#ctx div{padding:11px 16px;cursor:pointer}#ctx div:hover{background:var(--bd)}#ctx .rr{display:flex;justify-content:space-around;font-size:22px;padding:8px}#ctx .rr span{cursor:pointer;padding:2px 4px}
.ib2{position:absolute;right:14px;bottom:80px;background:var(--pn);width:40px;height:40px;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.4);display:grid;place-items:center}
.bar{background:var(--pn);padding:8px 14px;display:flex;align-items:center;gap:10px;font-size:13.5px;border-left:4px solid var(--ac)}.bar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim)}
.cmp{background:var(--pn);padding:8px 10px calc(8px + var(--sb));display:flex;align-items:flex-end;gap:6px;flex-shrink:0}
.cmp textarea{background:var(--bg);border-radius:22px;padding:11px 16px;max-height:130px;resize:none;line-height:1.35}
.sbtn{background:var(--ac);color:#fff;width:46px;height:46px;border-radius:50%;font-size:19px;flex-shrink:0}
.pnl{background:var(--pn);display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:8px;max-height:200px;overflow-y:auto;font-size:24px;text-align:center}.pnl span{cursor:pointer;padding:4px}
.att{background:var(--pn);display:flex;gap:10px;padding:10px 14px}.att button{flex:1;background:var(--bg);border-radius:12px;padding:12px 4px;font-size:13px;color:var(--dim)}.att i{display:block;font-style:normal;font-size:24px}
.rec{background:rgba(241,92,109,.15);padding:10px 16px;display:flex;gap:12px;align-items:center;color:var(--dg);font-weight:700}.rec span{flex:1}
.mb{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:grid;place-items:center;padding:14px}
.md{background:var(--pn);border-radius:16px;padding:22px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto}.md h2{margin-bottom:12px;font-size:19px}
.md .btn{margin-top:8px}.row{display:flex;align-items:center;gap:12px;padding:8px 0;cursor:pointer}.row span{flex:1}
.sw{display:inline-block;width:34px;height:34px;border-radius:50%;margin:4px;border:2px solid var(--bd);cursor:pointer}
#toast{position:fixed;bottom:calc(30px + var(--sb));left:50%;transform:translateX(-50%);background:var(--pn);border:1px solid var(--bd);padding:10px 20px;border-radius:10px;z-index:400;box-shadow:0 4px 16px rgba(0,0,0,.4)}
#vw{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:350;display:grid;place-items:center}#vw img{max-width:96%;max-height:96%}
</style>
</head>
<body>
<div id="login"><div class="lc">
<h1>💬 WaqarChat</h1><p>Apna naam aur ek unique ID chunein</p>
<input id="ln" placeholder="Aap ka naam" maxlength="24">
<input id="li" placeholder="unique-id (a-z, 0-9, -)" maxlength="20" autocapitalize="off" spellcheck="false">
<button class="btn" id="lb" onclick="login()">Start Chatting</button>
<div id="le" style="color:var(--dg);margin-top:10px;font-size:13px"></div>
</div></div>

<div id="app" class="hide">
<aside id="side">
  <div class="hd"><div id="mav" onclick="profile()" style="cursor:pointer"></div><div class="t" onclick="profile()"><div class="n" id="mn"></div><div class="s" id="mi" onclick="event.stopPropagation();copyId()"></div></div>
  <button class="ib" onclick="newGroup()" title="New group">👥</button><button class="ib" onclick="settings()">⚙️</button></div>
  <div class="sr"><input id="q" placeholder="🔍 Chats search karein" oninput="renderList()"></div>
  <div class="chips"><button class="chip on" data-f="all" onclick="setF('all')">All</button><button class="chip" data-f="unread" onclick="setF('unread')">Unread</button><button class="chip" data-f="groups" onclick="setF('groups')">Groups</button></div>
  <div id="list"></div>
  <button class="fab" onclick="newChat()">➕</button>
</aside>
<main id="main">
  <div id="welcome"><div><div style="font-size:70px">💬</div><h2>WaqarChat</h2><p>Chat kholein ya ➕ dabakar nayi chat shuru karein</p></div></div>
  <div id="chat" class="hide" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <div class="hd"><button class="ib" id="back" onclick="closeChat()">←</button><div id="hav" onclick="info()" style="cursor:pointer"></div>
      <div class="t" onclick="info()"><div class="n" id="hn"></div><div class="s" id="hs"></div></div>
      <button class="ib" onclick="toggleSearch()">🔍</button><button class="ib" onclick="chatMenu()">⋮</button></div>
    <div class="sr hide" id="msr"><input id="mq" placeholder="Is chat mein search..." oninput="searchQ=this.value;render()"></div>
    <div id="msgs"></div>
    <button class="ib2 hide" id="dn" onclick="toBottom()">⬇️</button>
    <div class="bar hide" id="rbar"></div>
    <div class="pnl hide" id="emo"></div>
    <div class="att hide" id="att"><button onclick="pick('image/*')"><i>🖼️</i>Photo</button><button onclick="pick('image/*',1)"><i>📷</i>Camera</button><button onclick="pick('*/*')"><i>📎</i>File</button><button onclick="pick('audio/*')"><i>🎵</i>Audio</button></div>
    <div class="rec hide" id="rec">🔴 <span id="rt">0:00</span><button onclick="stopRec(0)">Cancel</button><button onclick="stopRec(1)" style="color:var(--ac)">Send ➤</button></div>
    <div class="cmp"><button class="ib" onclick="$('#emo').classList.toggle('hide');$('#att').classList.add('hide')">😊</button>
      <button class="ib" onclick="$('#att').classList.toggle('hide');$('#emo').classList.add('hide')">📎</button>
      <textarea id="inp" rows="1" placeholder="Message likhein"></textarea>
      <button class="sbtn" id="sb" onclick="send()">🎤</button></div>
  </div>
</main>
</div>
<div id="ctx" class="hide"></div><div id="modal"></div><input type="file" id="fp" class="hide">

<script>
const FB={apiKey:"AIzaSyAZtS_Cej59NEDhWo6WV2MsvTj2hZERbe8",authDomain:"pakfriend-chat.firebaseapp.com",projectId:"pakfriend-chat",storageBucket:"pakfriend-chat.firebasestorage.app",messagingSenderId:"868155894444",appId:"1:868155894444:web:9b6ec28cd3fee4fb208d09"};
const C='pakchat_messages',U='pakchat_users';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get:(k,d)=>{try{const v=localStorage.getItem('wc_'+k);return v?JSON.parse(v):d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem('wc_'+k,JSON.stringify(v))}catch(e){}}};
const AVC=['#00a884','#53bdeb','#8b5cf6','#f472b6','#fb923c','#eab308','#4ade80','#f87171','#a78bfa','#34d399'];
const pc=s=>{let h=0;for(const x of String(s))h=(h*31+x.charCodeAt(0))>>>0;return AVC[h%AVC.length]};
const tm=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const dl=t=>{const d=new Date(t),n=new Date();if(d.toDateString()==n.toDateString())return'Today';n.setDate(n.getDate()-1);return d.toDateString()==n.toDateString()?'Yesterday':d.toLocaleDateString([],{day:'numeric',month:'short',year:'numeric'})};
const fs=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(0)+' KB':(b/1048576).toFixed(1)+' MB';
const mm=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const slug=s=>String(s||'').toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,20);
const lnk=t=>esc(t).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
const lt=c=>c.msgs.length?c.msgs[c.msgs.length-1].ts:0;
const EM=Array.from('😀😁😂🤣😊😍😘😎🤔😢😭😡😮🥳😴🤗🙄😏🥺😇🤩😜🤝👍👎👏🙏💪👌✌️🤞👋❤️💔🔥✨🎉🎂🌹☕🍕🍔🍉🌙⭐☀️🌈🏏⚽🚗✈️📱💻🎧📷🎁💯✅❌⚡💤🙈');
let me=LS.get('me',null),chats={},cur=null,db=null,pres={},unsubs={},replyTo=null,editing=null,filter='all',searchQ='',lastTyp=0,mrec=null,rchunks=[],rsec=0,rtimer=null;

function av(dp,name,color,cls='',extra=''){return `<div class="av ${cls}" style="background:${color}">${dp?`<img src="${dp}" style="width:100%;height:100%;object-fit:cover">`:esc((name||'?')[0].toUpperCase())}${extra}</div>`}
function toast(t){const e=document.createElement('div');e.id='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2400)}

/* ---------- storage (IndexedDB, instant load) ---------- */
const idb=new Promise(r=>{try{const q=indexedDB.open('wc',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
async function idbGet(k){const d=await idb;if(!d)return null;return new Promise(r=>{const q=d.transaction('k').objectStore('k').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}
async function idbSet(k,v){const d=await idb;if(d)try{d.transaction('k','readwrite').objectStore('k').put(v,k)}catch(e){}}
let st;function save(){clearTimeout(st);st=setTimeout(saveNow,60)}function saveNow(){if(me)idbSet('chats_'+me.id,chats)}
addEventListener('pagehide',saveNow);

/* ---------- boot / login ---------- */
async function boot(){
  if(LS.get('theme','dark')==='light')document.body.classList.add('light');
  if(me&&me.id){
    chats=(await idbGet('chats_'+me.id))||{};
    if(!Object.keys(chats).length){const o=LS.get('chats',null);if(o)Object.entries(o).forEach(([id,c])=>{chats[id]={type:'dm',name:c.name||id,msgs:(c.messages||[]).filter(m=>m.kind!=='system').map(m=>({id:m.ts+'o',from:m.from==='me'?me.id:(m.senderId||id),ts:m.ts,kind:m.kind||'text',text:m.text,data:m.data,name:m.name,size:m.size,dur:m.duration,status:'read'})),unread:0}})}
    enter();
  }else{$('#login').classList.remove('hide');$('#li').value='user-'+Math.floor(1000+Math.random()*9000)}
}
$('#li').addEventListener('input',e=>e.target.value=slug(e.target.value));
async function login(){
  const name=$('#ln').value.trim(),id=slug($('#li').value);
  if(!name)return $('#le').textContent='Naam likhein';
  if(id.length<3)return $('#le').textContent='ID kam az kam 3 characters ki ho';
  $('#lb').disabled=true;$('#le').textContent='';
  try{
    initFB();const ref=db.collection(U).doc(id);
    const s=await ref.get({source:'server'}).catch(()=>null);
    const tok=(me&&me.id===id&&me.tok)||Math.random().toString(36).slice(2)+Date.now().toString(36);
    if(s&&s.exists&&s.data().tok&&s.data().tok!==tok){$('#le').textContent='Yeh ID kisi aur ke paas hai. Doosri ID chunein.';$('#lb').disabled=false;return}
    me={id,name,tok,color:pc(id),dp:(me&&me.dp)||null};LS.set('me',me);
    await ref.set({name,color:me.color,tok,dp:me.dp,lastSeen:Date.now()},{merge:true});
    chats=(await idbGet('chats_'+id))||{};enter();
  }catch(e){$('#le').textContent='Server se connect nahi hua. Internet check karein.';$('#lb').disabled=false}
}
let fbOK=false;
function initFB(){if(fbOK)return;if(!firebase.apps.length)firebase.initializeApp(FB);db=firebase.firestore();db.enablePersistence({synchronizeTabs:true}).catch(()=>{});fbOK=true}
function enter(){
  $('#login').classList.add('hide');$('#app').classList.remove('hide');
  me.blocked=me.blocked||[];
  $('#mav').innerHTML=av(me.dp,me.name,me.color,'sm');$('#mn').textContent=me.name;$('#mi').textContent=me.id+' 📋';
  buildEmoji();renderList();   // chats turant dikh jati hain (offline bhi)
  const last=LS.get('last',null);if(last&&chats[last]&&innerWidth>860)openChat(last);
  try{initFB()}catch(e){return}
  ping();setInterval(()=>{if(!document.hidden)ping()},25000);
  Object.entries(chats).forEach(([id,c])=>{if(c.type==='dm')watch(id);else(c.members||[]).forEach(watch)});
  listen();
  if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();
}
function ping(x){if(db&&me)db.collection(U).doc(me.id).set({lastSeen:Date.now(),...(x||{})},{merge:true}).catch(()=>{})}
document.addEventListener('visibilitychange',()=>{if(!me)return;if(!document.hidden){ping();if(cur){chats[cur].unread=0;markRead(cur);renderList()}}else saveNow()});

/* ---------- presence / profiles ---------- */
function watch(id){
  if(id===me.id||unsubs[id])return;
  unsubs[id]=db.collection(U).doc(id).onSnapshot(s=>{
    if(!s.exists)return;const p=pres[id]=s.data(),c=chats[id];
    if(c&&c.type==='dm'){c.name=c.alias||p.name;c.dp=p.dp||null;c.color=p.color||pc(id)}
    renderList();if(cur===id||(chats[cur]&&chats[cur].type==='group'))hdr();
    if(p.typing===me.id&&Date.now()-p.typingAt<4000)setTimeout(hdr,4200);
  },()=>{});
}
function seen(id){const p=pres[id];if(!p)return'';if(p.typing===me.id&&Date.now()-p.typingAt<4000)return'typing…';if(Date.now()-p.lastSeen<60000)return'online';const d=dl(p.lastSeen);return'last seen '+(d==='Today'?'today':d==='Yesterday'?'yesterday':d)+' at '+tm(p.lastSeen)}
const isOn=id=>pres[id]&&Date.now()-pres[id].lastSeen<60000;
const nameOf=id=>id===me.id?'Aap':(pres[id]&&pres[id].name)||(chats[id]&&chats[id].name)||id;

/* ---------- send / receive ---------- */
function put(to,o,gid){return db.collection(C).add({to,from:me.id,fromName:me.name,gid:gid||null,createdAt:Date.now(),...o})}
function wire(cid,o){
  const c=chats[cid],g=c.type==='group',rs=g?c.members.filter(x=>x!==me.id):[cid];
  const base=g?{gname:c.name,members:c.members}:{};
  return Promise.all(rs.map(r=>put(r,{...base,...o},g?cid:null)));
}
function post(cid,p){
  const c=chats[cid];
  const m={id:Date.now()+'_'+Math.random().toString(36).slice(2,6),from:me.id,ts:Date.now(),status:'pending',...p};
  if(replyTo&&cur===cid){m.reply=replyTo;cancelRB()}
  c.msgs.push(m);c.draft='';save();render(1);renderList();
  wire(cid,{t:'m',id:m.id,ts:m.ts,kind:m.kind,text:m.text||'',data:m.data||null,name:m.name||null,size:m.size||null,dur:m.dur||null,reply:m.reply||null,fwd:m.fwd||0})
   .then(()=>{if(m.status==='pending'){m.status='sent';save();render();renderList()}}).catch(()=>{});
}
function listen(){
  db.collection(C).where('to','==',me.id).onSnapshot(s=>{
    s.docChanges().forEach(ch=>{if(ch.type!=='added')return;const d=ch.doc.data();try{handle(d)}catch(e){console.error(e)}ch.doc.ref.delete().catch(()=>{})});
    saveNow();renderList();if(cur)render();
  },e=>console.error(e));
}
function handle(d){
  if(!d.t||me.blocked.includes(d.from))return;
  const cid=d.gid||d.from;let isNew=false;
  if(!chats[cid]){isNew=true;chats[cid]=d.gid?{type:'group',name:d.gname||'Group',members:d.members||[],msgs:[],unread:0,color:pc(cid)}:{type:'dm',name:d.fromName||cid,msgs:[],unread:0,color:pc(cid)};
    if(d.gid)(d.members||[]).forEach(watch);else watch(cid)}
  const c=chats[cid],f=id=>c.msgs.find(m=>m.id===id);
  switch(d.t){
  case'ginfo':c.name=d.gname||c.name;c.members=d.members||c.members;if(d.gdp)c.dp=d.gdp;c.members.forEach(watch);
    if(isNew)c.msgs.push({id:'s'+Date.now(),kind:'sys',text:nameOf(d.from)+' ne aap ko group mein add kiya',ts:Date.now()});break;
  case'm':{
    if(f(d.id))break;
    const m={id:d.id,from:d.from,sn:d.fromName,ts:d.ts,kind:d.kind,text:d.text,data:d.data,name:d.name,size:d.size,dur:d.dur,reply:d.reply,fwd:d.fwd};
    c.msgs.push(m);c.msgs.sort((a,b)=>a.ts-b.ts);
    put(d.from,{t:'ack',ids:[d.id]},d.gid).catch(()=>{});
    if(cur===cid&&!document.hidden){markRead(cid)}
    else{c.unread=(c.unread||0)+1;if(!c.mute)notify(c.type==='group'?c.name:c.name,(c.type==='group'?nameOf(d.from)+': ':'')+(d.text||'['+d.kind+']'),cid)}
    break}
  case'ack':(d.ids||[]).forEach(i=>{const m=f(i);if(m&&m.status!=='read')m.status='delivered'});break;
  case'read':(d.ids||[]).forEach(i=>{const m=f(i);if(m)m.status='read'});break;
  case'edit':{const m=f(d.id);if(m){m.text=d.text;m.edited=1}break}
  case'del':{const m=f(d.id);if(m){m.deleted=1;m.text='';m.data=null}break}
  case'react':{const m=f(d.id);if(m){m.react=m.react||{};if(d.e)m.react[d.from]=d.e;else delete m.react[d.from]}break}
  }
}
function markRead(cid){
  const c=chats[cid];if(!c)return;
  const ids=c.msgs.filter(m=>m.from!==me.id&&!m.rd&&m.kind!=='sys').map(m=>{m.rd=1;return m.id});
  if(ids.length&&c.type==='dm')put(cid,{t:'read',ids}).catch(()=>{});
  save();
}
function notify(t,b,cid){
  if(!document.hidden||!('Notification' in window)||Notification.permission!=='granted')return;
  try{const n=new Notification(t,{body:b.slice(0,120),tag:cid});n.onclick=()=>{focus();openChat(cid);n.close()}}catch(e){}
}

   :'<div class="empty">Koi chat nahi mili.<br>➕ dabayein aur dost ki ID dalein.</div>';

  if(cur&&chats[cur])chats[cur].draft=$('#inp').value;
  cur=id;const c=chats[id];c.unread=0;replyTo=editing=null;searchQ='';$('#mq').value='';$('#msr').classList.add('hide');

function closeChat(){if(cur&&chats[cur])chats[cur].draft=$('#inp').value;cur=null;$('#app').classList.remove('open');$('#chat').classList.add('hide');$('#welcome').classList.remove('hide');renderList()}
function hdr(){
  const c=chats[cur];if(!c)return;
  $('#hav').innerHTML=av(c.dp,c.name,c.color||pc(cur),'sm');$('#hn').textContent=c.name||cur;
  const s=c.type==='group'?c.members.map(nameOf).join(', '):seen(cur);
  const e=$('#hs');e.textContent=s;e.className='s'+(s==='online'||s==='typing…'?' on':'');
}
function render(force){
  const c=chats[cur];if(!c)return;const box=$('#msgs');
  const near=force||box.scrollHeight-box.scrollTop-box.clientHeight<140;
  const q=searchQ.toLowerCase();let h='',ld='';
  c.msgs.forEach(m=>{
    if(q&&!(m.text||'').toLowerCase().includes(q))return;
    const dy=dl(m.ts);if(dy!==ld){h+=`<div class="day">${dy}</div>`;ld=dy}
    if(m.kind==='sys'){h+=`<div class="sys">${esc(m.text)}</div>`;return}
    const mine=m.from===me.id;let b='';
    if(c.type==='group'&&!mine)b+=`<div class="sn" style="color:${pc(m.from)}">${esc(nameOf(m.from)===m.from&&m.sn?m.sn:nameOf(m.from))}</div>`;
    if(m.deleted)b+='<i class="dd">🚫 Yeh message delete kar diya gaya</i>';
    else{
      if(m.fwd)b+='<div class="fw">↪ Forwarded</div>';
      if(m.reply)b+=`<div class="rq" onclick="jump('${m.reply.id}')"><b>${esc(m.reply.who)}</b><span>${esc(m.reply.text)}</span></div>`;
      if(m.kind==='image')b+=`<img class="mi" src="${m.data}" onclick="viewImg(this.src)">`;
      else if(m.kind==='file')b+=`<div class="fl"><span style="font-size:28px">📄</span><div><a download="${esc(m.name)}" href="${m.data}">${esc(m.name)}</a><div class="mt" style="text-align:left">${fs(m.size||0)}</div></div></div>`;
      else if(m.kind==='voice')b+=`<audio controls preload="none" src="${m.data}"></audio>`;
      else b+=`<div class="t">${lnk(m.text)}</div>`;
    }
    const rx=Object.values(m.react||{});let rh='';
    if(rx.length){const cnt={};rx.forEach(e=>cnt[e]=(cnt[e]||0)+1);rh=`<div class="rx">${Object.entries(cnt).map(([e,n])=>e+(n>1?n:'')).join(' ')}</div>`}
    h+=`<div class="msg ${mine?'me':'yo'} ${rh?'hr':''}" id="m_${m.id}" data-id="${m.id}"><button class="chev" onclick="menu(event,'${m.id}')">⌄</button>${b}<div class="mt">${m.star?'⭐ ':''}${m.edited&&!m.deleted?'edited ':''}${tm(m.ts)} ${mine?tk(m.status):''}</div>${rh}</div>`;
  });
  box.innerHTML=h;if(near)box.scrollTop=box.scrollHeight;
}

/* ---------- message menu ---------- */
function menu(e,id){
  e.stopPropagation&&e.stopPropagation();const m=find(id);if(!m)return;const mine=m.from===me.id;
  const it=(l,f)=>`<div onclick="closeCtx();${f}">${l}</div>`;
  const R=['👍','❤️','😂','😮','😢','🙏'].map(x=>`<span onclick="closeCtx();react('${id}','${x}')">${x}</span>`).join('');
  const h=m.deleted?it('🗑️ Delete for me',`delMe('${id}')`):`<div class="rr">${R}</div>`+it('↩️ Reply',`setReply('${id}')`)+(m.kind==='text'?it('📋 Copy',`navigator.clipboard.writeText(find('${id}').text);toast('Copy ho gaya')`):'')+(mine&&m.kind==='text'&&Date.now()-m.ts<9e5?it('✏️ Edit',`startEdit('${id}')`):'')+it(m.star?'☆ Unstar':'⭐ Star',`find('${id}').star=!find('${id}').star;save();render()`)+it('↪️ Forward',`fwd('${id}')`)+it('🗑️ Delete for me',`delMe('${id}')`)+(mine?it('🚫 Delete for everyone',`delAll('${id}')`):'');
  const x=$('#ctx');x.innerHTML=h;x.classList.remove('hide');
  const p=e.touches?e.touches[0]:e;x.style.left=Math.max(8,Math.min(p.clientX,innerWidth-215))+'px';x.style.top=Math.max(8,Math.min(p.clientY,innerHeight-x.offsetHeight-10))+'px';
}
function closeCtx(){$('#ctx').classList.add('hide')}
document.addEventListener('click',closeCtx);
$('#msgs').addEventListener('contextmenu',e=>{const m=e.target.closest('.msg');if(m){e.preventDefault();menu(e,m.dataset.id)}});
let lp,tx,ty;
$('#msgs').addEventListener('touchstart',e=>{const m=e.target.closest('.msg');if(!m)return;const t=e.touches[0];tx=t.clientX;ty=t.clientY;lp=setTimeout(()=>menu({clientX:tx,clientY:ty,stopPropagation(){}},m.dataset.id),500)},{passive:true});

/* ---------- composer ---------- */
function fit(){const i=$('#inp');i.style.height='auto';i.style.height=Math.min(130,i.scrollHeight)+'px'}
function sicon(){$('#sb').textContent=editing?'✓':$('#inp').value.trim()?'➤':'🎤'}
function send(){
  const t=$('#inp').value.trim();
  if(!t&&!editing){return toggleRec()}
  if(!cur||!t)return;
  if(editing){const m=find(editing);m.text=t;m.edited=1;wire(cur,{t:'edit',id:editing,text:t});editing=null;$('#rbar').classList.add('hide');save();render();renderList()}
  else post(cur,{kind:'text',text:t});
  $('#inp').value='';fit();sicon();
}
$('#inp').addEventListener('input',()=>{
  fit();sicon();if(!cur)return;
  if(chats[cur].type==='dm'&&Date.now()-lastTyp>2000){lastTyp=Date.now();ping({typing:cur,typingAt:Date.now()})}
});
$('#inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&matchMedia('(pointer:fine)').matches){e.preventDefault();send()}});
function buildEmoji(){$('#emo').innerHTML=EM.map(e=>`<span>${e}</span>`).join('');$('#emo').onclick=e=>{if(e.target.tagName==='SPAN'){$('#inp').value+=e.target.textContent;fit();sicon()}}}
let fcap=0;
function pick(a,cap){const f=$('#fp');f.accept=a;cap?f.setAttribute('capture','environment'):f.removeAttribute('capture');f.click();$('#att').classList.add('hide')}
function imgC(file,max,q,sq){return new Promise(r=>{const i=new Image();i.onload=()=>{const cv=document.createElement('canvas'),x=cv.getContext('2d');
  if(sq){const s=Math.min(i.width,i.height);cv.width=cv.height=max;x.drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,max,max)}
  else{const k=Math.min(1,max/Math.max(i.width,i.height));cv.width=i.width*k|0;cv.height=i.height*k|0;x.drawImage(i,0,0,cv.width,cv.height)}
  r(cv.toDataURL('image/jpeg',q))};i.src=URL.createObjectURL(file)})}
$('#fp').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f||!cur)return;
  if(f.type.startsWith('image/')){return post(cur,{kind:'image',data:await imgC(f,1100,.72),name:f.name})}
  if(f.size>700*1024)return toast('File 700KB se chhoti honi chahiye');
  const r=new FileReader();r.onload=()=>post(cur,{kind:f.type.startsWith('audio/')?'voice':'file',data:r.result,name:f.name,size:f.size,dur:0});r.readAsDataURL(f);
});
async function toggleRec(){
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:true});rchunks=[];
    mrec=new MediaRecorder(s);mrec.ondataavailable=e=>e.data.size&&rchunks.push(e.data);
    mrec.onstop=()=>{s.getTracks().forEach(t=>t.stop());if(!mrec.send||!rchunks.length)return;const r=new FileReader();r.onload=()=>post(cur,{kind:'voice',data:r.result,dur:rsec});r.readAsDataURL(new Blob(rchunks,{type:mrec.mimeType}))};
    mrec.start();rsec=0;$('#rt').textContent='0:00';$('#rec').classList.remove('hide');
    rtimer=setInterval(()=>{rsec++;$('#rt').textContent=mm(rsec);if(rsec>=90)stopRec(1)},1000);
  }catch(e){toast('Mic ki permission nahi mili')}
}
function stopRec(send){clearInterval(rtimer);$('#rec').classList.add('hide');if(mrec&&mrec.state==='recording'){mrec.send=send;mrec.stop()}}

function blockToggle(){const i=me.blocked.indexOf(cur);if(i>=0)me.blocked.splice(i,1);else me.blocked.push(cur);LS.set('me',me);closeM();toast(i>=0?'Unblock ho gaya':'Block ho gaya')}
async function addMem(){
  const id=slug($('#am').value),c=chats[cur];if(!id||c.members.includes(id))return;
  const s=await db.collection(U).doc(id).get().catch(()=>null);if(!s||!s.exists)return toast('Yeh ID nahi mili');
  c.members.push(id);watch(id);c.msgs.push({id:'s'+Date.now(),kind:'sys',text:nameOf(id)+' ko add kiya gaya',ts:Date.now()});wire(cur,{t:'ginfo',gdp:c.dp||null});save();render();hdr();closeM();
}
function leaveG(){if(!confirm('Group chhodein?'))return;const c=chats[cur];c.members=c.members.filter(x=>x!==me.id);wire(cur,{t:'ginfo'});delete chats[cur];save();closeM();closeChat()}
function gdp(){const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=async()=>{if(f.files[0]){chats[cur].dp=await imgC(f.files[0],120,.7,1);wire(cur,{t:'ginfo',gdp:chats[cur].dp});save();hdr();renderList();info()}};f.click()}
function chatMenu(){
  const c=chats[cur];
  modal(`<h2>${esc(c.name)}</h2><button class="btn g" onclick="closeM();info()">ℹ️ Info</button><button class="btn g" onclick="c1('pin')">${c.pin?'📌 Unpin':'📌 Pin chat'}</button><button class="btn g" onclick="c1('mute')">${c.mute?'🔔 Unmute':'🔇 Mute'}</button>
  <button class="btn g" onclick="closeM();clearChat()">🧹 Chat clear karein</button><button class="btn r" onclick="closeM();delChat()">🗑️ Chat delete karein</button><button class="btn g" onclick="closeM()">Cancel</button>`);
}
function c1(k){chats[cur][k]=!chats[cur][k];save();renderList();closeM()}
function clearChat(){if(confirm('Saare messages hata dein?')){chats[cur].msgs=[];save();render();renderList()}}
function delChat(){if(confirm('Chat delete karein?')){delete chats[cur];save();closeChat()}}
function profile(){
  modal(`<div onclick="mdp()" style="cursor:pointer">${av(me.dp,me.name,me.color,'lg')}</div><p style="text-align:center;color:var(--dim);margin-bottom:12px">DP badalne ke liye photo dabayein</p>
  <input class="fld" id="pn" value="${esc(me.name)}" maxlength="24"><input class="fld" value="${esc(me.id)}" readonly>
  <button class="btn" onclick="saveP()">💾 Save</button>${me.dp?'<button class="btn g" onclick="me.dp=null;saveP()">DP hatayein</button>':''}<button class="btn g" onclick="closeM()">Cancel</button>`);
}
function mdp(){const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=async()=>{if(f.files[0]){me.dp=await imgC(f.files[0],128,.7,1);profile()}};f.click()}
function saveP(){const n=($('#pn')&&$('#pn').value.trim())||me.name;me.name=n;LS.set('me',me);ping({name:n,dp:me.dp});$('#mav').innerHTML=av(me.dp,me.name,me.color,'sm');$('#mn').textContent=n;closeM();toast('Profile save ho gaya')}
function settings(){
  modal(`<h2>⚙️ Settings</h2><div class="row" onclick="setTheme()"><span>🌓 Theme badlein (Dark / Light)</span></div>
  <div style="margin:8px 0">🖼️ Chat background<br>${['','#0d1b2a','#1b2a1b','#2a1b2a','#2a2418','#e8d9c5'].map(c=>`<span class="sw" style="background:${c||'var(--ch)'}" onclick="me.wp='${c}';LS.set('me',me);if(cur)openChat(cur);closeM()"></span>`).join('')}</div>
  <div class="row" onclick="Notification.requestPermission().then(()=>toast('Notifications check ho gayi'))"><span>🔔 Notifications on karein</span></div>
  <div class="row" onclick="closeM();showBlocked()"><span>🚫 Blocked users (${me.blocked.length})</span></div>
  <div class="mt" style="text-align:center;margin:10px 0">Created by Waqar Ahmed</div>
  <button class="btn g" onclick="logout()">🚪 Logout</button><button class="btn r" onclick="resetAll()">🗑️ Reset All</button><button class="btn g" onclick="closeM()">Close</button>`);
}
function showBlocked(){modal(`<h2>Blocked</h2>${me.blocked.map(i=>`<div class="row"><span>${esc(i)}</span><button onclick="me.blocked=me.blocked.filter(x=>x!=='${i}');LS.set('me',me);showBlocked()">Unblock</button></div>`).join('')||'Koi nahi'}<button class="btn g" onclick="closeM()">Close</button>`)}
function setTheme(){const l=document.body.classList.toggle('light');LS.set('theme',l?'light':'dark');closeM()}
function logout(){if(confirm('Logout? Chats is device par safe rahengi.')){saveNow();setTimeout(()=>location.reload(),150);localStorage.removeItem('wc_me')}}
function resetAll(){if(confirm('Sab kuch delete? ID aur chats gayab ho jayengi.')){localStorage.clear();indexedDB.deleteDatabase('wc');setTimeout(()=>location.reload(),300)}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeM();closeCtx()}});
boot();
</script>
</body>
</html>
